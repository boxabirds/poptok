# The pipeline's steps and what each is built from: the dependency graph, in one place (like a Makefile's rules).
# Read by pipeline/steps.py; a step's recipe (the commands) is the block after `if need STEP` in ./poptok or
# bin/make_video.sh, which run the steps in this file's order. A step runs again when any input's content or any
# setting's value has changed since it was built (pipeline/deps.py); `python3 pipeline/steps.py graph` draws the graph
# and checks it, `./poptok PIECE --explain` says what would run now and why.
#
# Fields:
#   about     what the step makes
#   when      the condition under which the script runs it (documentation; the script tests it)
#   dir       where its build record is kept (DIR/.deps/STEP.done)
#   target    the file that exists once the step is complete
#   outputs   moved aside (NAME.prev) before a fresh run, so tools that skip existing files can't reuse them
#   inputs    files and folders it is built from; one that expands to nothing (an unset option) is left out
#   settings  environment values it is built from; NAME=DEFAULT when unset means DEFAULT
#   mode      fresh: a stale step starts again; resume: an unfinished run with the same inputs is picked up
#             (keyframes, video, lip-sync); manual: people edit its outputs, so a stale step is only reported
#             (./poptok --redo STEP runs it)
# {NAME} is an environment value set by the script: PIECE; ANA (analysis folder), STEM (song file name), TAG (-true),
# SONG (song file), LYRICS_FILE, SEGS (lyric timings); OUT (the run folder); CUES, TREAT, LCTX, PHOTO (option files).

[songwriters]
about    = lyrics and music style from a prompt (pipeline/songwriters.py)
when     = SONG_PROMPT set
dir      = {PIECE}
target   = {PIECE}/inputs/songwriters.md
inputs   = {SONG_PROMPT_FILE}
settings = SONG_PROMPT SONG_FORM
mode     = manual

[song]
about    = the song, best of SONG_SEEDS by lyric match (bin/make_song.sh, ACE-Step)
when     = SONG empty
dir      = {PIECE}
target   = {PIECE}/outputs/song.wav
inputs   = {MUSIC_STYLE_FILE}
           {LYRICS_FILE}
settings = SONG_SEEDS SONG_DURATION
mode     = manual

[analysis]
about    = stems and Whisper words (pipeline/analyse.py)
dir      = {ANA}
target   = {ANA}/{STEM}-medium.json
outputs  = {ANA}/{STEM}-medium.json
           {ANA}/{STEM}-drums.mp3
inputs   = {SONG}
mode     = fresh

[beats]
about    = beat grid (pipeline/beat_grid.py)
dir      = {ANA}
target   = {ANA}/beats.json
inputs   = {SONG}
mode     = fresh

[drums]
about    = deep drum hits (pipeline/drum_hits.py)
dir      = {ANA}
target   = {ANA}/drum_hits.json
inputs   = {ANA}/{STEM}-drums.mp3
mode     = fresh

[segments]
about    = when each lyric line is sung (align_lyrics.py, then force_align.py)
dir      = {ANA}
target   = {SEGS}
inputs   = {SONG}
           {LYRICS_FILE}
           {ANA}/{STEM}-medium.json
mode     = fresh

[workshop]
about    = directors' workshop: treatment, universe and line-by-line storyboard (pipeline/workshop.py); its
           visual-treatment.txt, universe.txt and lyrics-cued.txt are what piece.env's TREATMENT and CUES name
when     = WORKSHOP=1
dir      = {PIECE}
target   = {PIECE}/inputs/workshop.md
inputs   = {LYRICS_FILE}
           {PIECE}/inputs/brief.txt
           {SEGS}
mode     = manual

[prompts]
about    = one image prompt per line (prompts_per_line.py, or treatment.py with DIRECTOR=1)
dir      = {ANA}
target   = {ANA}/full-metadata{TAG}.json
outputs  = {ANA}/full-metadata{TAG}.json
           {ANA}/{STEM}-visual-prompts{TAG}.json
inputs   = {SEGS}
           {TREAT}
           {CUES}
           {LCTX}
settings = STYLE PERFORMER WARDROBE STYLE_WORD STYLE_BRIEF NOTEXT
mode     = fresh

[keys]
about    = the shot list and one still per shot (keyframes.py MOSS; amber_keys.py for her), with the still check
dir      = {OUT}
target   = {OUT}/keys/.done
outputs  = {OUT}/keys
           {OUT}/shots.json
           {OUT}/reroll.json
inputs   = {ANA}/full-metadata{TAG}.json
           {ANA}/beats.json
           {PHOTO}
settings = STYLE STYLE_WORD STYLE_BRIEF WARDROBE PERFORMER
mode     = resume

[merge]
about    = near-duplicate scenes merged (merge_scenes.py)
dir      = {OUT}
target   = {OUT}/shots_merged.json
outputs  = {OUT}/shots_merged.json
inputs   = {OUT}/keys
           {OUT}/shots.json
settings = MERGE_ARGS
mode     = fresh

[scenes]
about    = the scene list and an A->B transition for every scene change (scenes.py build, transitions)
dir      = {OUT}
target   = {OUT}/scenes.json
outputs  = {OUT}/scenes.json
           {OUT}/scenes.applied.json
inputs   = {OUT}/shots_merged.json
           {SEGS}
           {CUES}
mode     = fresh

[video]
about    = the LTX chain, frame by frame (ltx_chain.py) on the video host
dir      = {OUT}
target   = {OUT}/ltx_chain/.done
outputs  = {OUT}/ltx_chain
           {OUT}/ltx_chain_beat
inputs   = {OUT}/keys
           {OUT}/shots_merged.json
           {OUT}/scenes.json
settings = LTX_ARGS
mode     = resume

[lipsync]
about    = the sung scenes as lip-synced clips (sing_inserts.py, bin/sing_inserts.sh); the finish and the splice
           into the video always run
when     = PERFORMER_PHOTO set
dir      = {OUT}
target   = {OUT}/sing/.done
outputs  = {OUT}/sing
inputs   = {OUT}/keys
           {OUT}/shots_merged.json
           {SEGS}
           {SONG}
settings = PERFORMER ENGINE=infinitetalk
mode     = resume
