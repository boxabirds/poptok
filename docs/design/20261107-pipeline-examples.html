</div><p class="big">R.Amber</p><div class="lab">Her look, one line</div><p class="big">“a young woman with long wavy blond hair”</p><div class="lab">What she wears in this piece</div><p>“a worn, faded cotton soldier field uniform in muted camouflage, creased and dusty, frayed at the cuffs, real fabric texture, her face streaked with green and black camouflage paint”</p></div></div><p class="cap">Everything she looks like downstream comes from these: the still is given to the image editor for every shot she is in; the two lines go into every picture description.</p><p class="src">Noble Hunt · 4a-singer</p></figure><figure class="ex" id="4b-story"><div class="task">Task 4 · Create the singer / actor</div><h2>The directors&#x27; story</h2><p class="logline">A soldier in a ruined city protects a hand-drawn peace symbol, moving from hiding in a dark interior to standing in the open dawn, choosing herself and her peace.</p><table class="tl"><tr><td><b>S1</b><br>0:00</td><td><b>Setup</b> · A dark, ruined apartment interior with a window looking out onto a wet street.<br><span class="dim">Amber hides in the dark, watching the rain.</span></td></tr><tr><td><b>S2</b><br>0:54</td><td><b>Pressure</b> · A wet, ruined street at night with a distant glow.<br><span class="dim">Amber walks through the street, carrying the cloth.</span></td></tr><tr><td><b>S3</b><br>1:32</td><td><b>Turn</b> · A bent, cracked corridor with sickly amber light.<br><span class="dim">Amber enters the bent corridor.</span></td></tr><tr><td><b>S4</b><br>2:01</td><td><b>Resolution</b> · An open plaza in the rain, lit by a mix of cyan and amber.<br><span class="dim">Amber steps into the open plaza.</span></td></tr><tr><td><b>S5</b><br>2:47</td><td><b>Climax</b> · The edge of the plaza, dawn breaking.<br><span class="dim">Amber raises the cloth, offering it or holding it up to see it.</span></td></tr><tr><td><b>S6</b><br>3:13</td><td><b>Denouement</b> · The same plaza, fully dawn, illuminated by pure pale gold.<br><span class="dim">Amber stands in the dawn, the light shifting to pure pale gold.</span></td></tr></table><p class="cap">The directors' treatment, cut into its movements against the song (start times shown). The full treatment is prose; each movement here is its place and first action.</p><p class="src">Noble Hunt · 4b-story</p></figure><figure class="ex" id="4c-universes-proposed"><div class="task">Task 4 · Create the singer / actor</div><h2>15 universes proposed, 3 picked</h2><div class="chips"><span class="chip pick">Wet Clay &amp; Ash</span><span class="chip">Pressed Paper &amp; Ink</span><span class="chip">Glazed Ceramics</span><span class="chip">Woven Wire Mesh</span><span class="chip">Solidified Rain</span><span class="chip">Charred Wood</span><span class="chip">Dusted Chalk</span><span class="chip">Rusted Metal</span><span class="chip">Wet Paper Ruins</span><span class="chip pick">Felted Ash</span><span class="chip pick">Stained Glass Rain</span><span class="chip">Dust and Chalk</span><span class="chip">Waxed Cloth</span><span class="chip">Pressed Petals</span><span class="chip">Hand-Tinted Noir · directors’ own</span></div><p class="cap">What the world is made of, proposed by the language model: open ideas, ideas from the song's central image, and the directors' own. The producer picked the three outlined; each is drawn in two test shots next.</p><p class="src">Noble Hunt · 4c-universes-proposed</p></figure><figure class="ex" id="4d-universe-sheet"><div class="task">Task 4 · Create the singer / actor</div><h2>Each pick drawn in the same two shots</h2><div class="pk"><p class="big"><b>1. Felted Ash</b>  ✓ chosen</p><p class="dim">Matted, fibrous felt of compressed grey ash and wool.</p><div class="two"><div><img src="20261107-pipeline-examples/src/4d-pick1-opening.jpg" width="352"><div class="lab">opening · face 0.33</div></div><div><img src="20261107-pipeline-examples/src/4d-pick1-turn.jpg" width="352"><div class="lab">the turn · face 0.23</div></div></div></div><div class="pk"><p class="big"><b>2. Wet Clay &amp; Ash</b></p><p class="dim">Damp, grey-brown clay and fine volcanic ash.</p><div class="two"><div><img src="20261107-pipeline-examples/src/4d-pick2-opening.jpg" width="352"><div class="lab">opening · face 0.06</div></div><div><img src="20261107-pipeline-examples/src/4d-pick2-turn.jpg" width="352"><div class="lab">the turn · face 0.66</div></div></div></div><div class="pk"><p class="big"><b>3. Stained Glass Rain</b></p><p class="dim">Translucent, fragmented stained glass shards held together by dark lead lines.</p><div class="two"><div><img src="20261107-pipeline-examples/src/4d-pick3-opening.jpg" width="352"><div class="lab">opening · face 0.35</div></div><div><img src="20261107-pipeline-examples/src/4d-pick3-turn.jpg" width="352"><div class="lab">the turn · face 0.65</div></div></div></div><p class="cap">Two test shots with no material named in them, drawn in each picked universe, with her face put in from the avatar still. Face: how like her photo (0–1); 0.06 means the face pass failed. Noble Hunt v6 itself was drawn before this step, in the directors' own look (Hand-Tinted Noir), kept photographic as asked.</p><p class="src">Noble Hunt · 4d-universe-sheet</p></figure><figure class="ex" id="5a-storyboard"><div class="task">Task 5 · Design the video scenes</div><h2>Storyboard: the story as scenes</h2><table class="tl"><tr><td><b>S1</b><br>0:00–0:54</td><td>A dark, ruined apartment interior with a window looking out onto a wet street.<br><span class="dim">15 bars</span></td></tr><tr><td><b>S2</b><br>0:54–1:32</td><td>A wet, ruined street at night with a distant glow.<br><span class="dim">19 bars</span></td></tr><tr><td><b>S3</b><br>1:32–2:01</td><td>A bent, cracked corridor with sickly amber light.<br><span class="dim">16 bars</span></td></tr><tr><td><b>S4</b><br>2:01–2:47</td><td>An open plaza in the rain, lit by a mix of cyan and amber.<br><span class="dim">24 bars</span></td></tr><tr><td><b>S5</b><br>2:47–3:13</td><td>The edge of the plaza, dawn breaking.<br><span class="dim">14 bars</span></td></tr><tr><td><b>S6</b><br>3:13–4:02</td><td>The same plaza, fully dawn, illuminated by pure pale gold.<br><span class="dim">24 bars</span></td></tr></table><p class="cap">The directors turn the treatment into 6 scenes, each one place, and give every lyric line and instrumental gap a shot; split at the bar lines that is 112 stills for a 4-minute song.</p><p class="src">Noble Hunt · 5a-storyboard</p></figure><figure class="ex" id="5b-line-to-picture"><div class="task">Task 5 · Design the video scenes</div><h2>One line, from lyric to picture</h2><div class="lab">Lyric line · 1:00.7</div><p class="big">“Free is all we want to be”</p><div class="lab">The directors' shot</div><p class="big">Amber is mid-stride. We see her back. The cloth is visible.</p><div class="lab">Picture description (first 420 characters of 1326)</div><p class="mono">Hand-Tinted Noir: A low-angle, medium shot from behind the woman as she strides forward down the wet, ruined street at night. Her back fills the center of the frame, emphasizing her worn, faded cotton soldier field uniform in muted camouflage, creased and dusty with frayed cuffs, the real fabric texture visible under the dim light. Her long, wavy blond hair is damp and tangled, falling over her shoulders. In her hand, …</p><div class="lab">The still drawn from it (task 6)</div><img src="20261107-pipeline-examples/src/5b-still.jpg" width="712"><p class="cap">The picture description starts with the look, then the shot, then her wardrobe, written with the whole lyric and the previous line in view so consecutive shots stay in one world.</p><p class="src">Noble Hunt · 5b-line-to-picture</p></figure><figure class="ex" id="6a-one-still-per-bar"><div class="task">Task 6 · Create key frames</div><h2>One shot, one still per bar</h2><p class="big">Amber is now close to the camera, filling the frame. Her face is visible, tired, steady.</p><div class="two"><div><img src="20261107-pipeline-examples/src/6a-bar30.jpg" width="352"><div class="lab">bar 1 · 1:24.1</div></div><div><img src="20261107-pipeline-examples/src/6a-bar31.jpg" width="352"><div class="lab">bar 2 · 1:26.0</div></div><div><img src="20261107-pipeline-examples/src/6a-bar32.jpg" width="352"><div class="lab">bar 3 · 1:27.9</div></div><div><img src="20261107-pipeline-examples/src/6a-bar33.jpg" width="352"><div class="lab">bar 4 · 1:29.8</div></div></div><p class="cap">A 7.6 s instrumental shot, 4 bars long: four stills, one per bar, so the picture can change on the bar line. Neighbouring bars of one shot are then merged into video segments: 112 stills became 40 segments.</p><p class="src">Noble Hunt · 6a-one-still-per-bar</p></figure><figure class="ex" id="6b-drawn-from-avatar"><div class="task">Task 6 · Create key frames</div><h2>Drawn from the avatar still</h2><div class="two"><div><img src="20261107-pipeline-examples/src/6b-avatar.jpg" width="352"><div class="lab">The avatar still (input)</div></div><div><img src="20261107-pipeline-examples/src/6b-20.jpg" width="352"><div class="lab">Her whole figure · 1:05.2</div></div><div><img src="20261107-pipeline-examples/src/6b-44.jpg" width="352"><div class="lab">Only part of her (hand, back) · 1:50.7</div></div><div><img src="20261107-pipeline-examples/src/6b-59.jpg" width="352"><div class="lab">Singing · 2:19.1</div></div></div><p class="cap">Every still she is in is drawn by the image editor from the avatar still and the shot's words, in her wardrobe for the piece; there are three kinds of shot, depending on how much of her is seen.</p><p class="src">Noble Hunt · 6b-drawn-from-avatar</p></figure><figure class="ex" id="7a-transition-event"><div class="task">Task 7 · Create the scenes</div><h2>A change of scene, as an event</h2><div class="lab">The transition, written by the language model</div><p class="mono">Her hand thrusts the cloth forward, the peace symbol bursting into a dense storm of dust and rain that engulfs the lens. As the swirling particles clear, the tight corridor walls recede into the vast, wet plaza, revealing her full, resolute figure standing still in the cyan and amber light.</p><div class="two"><div><img src="20261107-pipeline-examples/src/7a-2885.jpg" width="352"><div class="lab">1 · 2:00.2</div></div><div><img src="20261107-pipeline-examples/src/7a-2905.jpg" width="352"><div class="lab">2 · 2:01.0</div></div><div><img src="20261107-pipeline-examples/src/7a-2918.jpg" width="352"><div class="lab">3 · 2:01.6</div></div><div><img src="20261107-pipeline-examples/src/7a-2926.jpg" width="352"><div class="lab">4 · 2:01.9</div></div><div><img src="20261107-pipeline-examples/src/7a-2934.jpg" width="352"><div class="lab">5 · 2:02.2</div></div><div><img src="20261107-pipeline-examples/src/7a-2960.jpg" width="352"><div class="lab">6 · 2:03.3</div></div></div><p class="cap">From the corridor (story scene S3) to the plaza (S4) at 2:02.0: LTX makes the dust storm the transition describes and comes out of it in the next scene, in one continuous take. Video frames, in order.</p><p class="src">Noble Hunt · 7a-transition-event</p></figure><figure class="ex" id="7b-camera-move"><div class="task">Task 7 · Create the scenes</div><h2>Inside a scene, a camera move</h2><div class="lab">The move, written by the language model</div><p class="mono">The camera tracks backward from behind her.</p><div class="two"><div><img src="20261107-pipeline-examples/src/7b-1661.jpg" width="352"><div class="lab">1 · 1:09.2</div></div><div><img src="20261107-pipeline-examples/src/7b-1702.jpg" width="352"><div class="lab">2 · 1:10.9</div></div><div><img src="20261107-pipeline-examples/src/7b-1744.jpg" width="352"><div class="lab">3 · 1:12.7</div></div><div><img src="20261107-pipeline-examples/src/7b-1786.jpg" width="352"><div class="lab">4 · 1:14.4</div></div></div><p class="cap">Within one story scene the change of still is written as a camera move, not an event, so the shot stays one place: here 5.7 s across 3 bars. Not always: in several other Noble Hunt moves the street drifts into a doorway on the way to the next still.</p><p class="src">Noble Hunt · 7b-camera-move</p></figure><figure class="ex" id="7c-lip-sync"><div class="task">Task 7 · Create the scenes</div><h2>The singing clip</h2><div class="lab">Sung here · 2:17.9–2:24.8</div><p class="big">“We’re carrying the only peace”</p><p class="big">“That no one else can take from me”</p><div class="lab">Its keyframe, drawn from the avatar still</div><img src="20261107-pipeline-examples/src/7c-key.jpg" width="712"><div class="lab">The clip, close on her face</div><div class="three"><div><img src="20261107-pipeline-examples/src/7c-0.jpg" width="232"><div class="lab">1 · 2:18.4</div></div><div><img src="20261107-pipeline-examples/src/7c-1.jpg" width="232"><div class="lab">2 · 2:19.3</div></div><div><img src="20261107-pipeline-examples/src/7c-2.jpg" width="232"><div class="lab">3 · 2:20.2</div></div><div><img src="20261107-pipeline-examples/src/7c-3.jpg" width="232"><div class="lab">4 · 2:21.1</div></div><div><img src="20261107-pipeline-examples/src/7c-4.jpg" width="232"><div class="lab">5 · 2:22.0</div></div><div><img src="20261107-pipeline-examples/src/7c-5.jpg" width="232"><div class="lab">6 · 2:22.9</div></div></div><p class="cap">InfiniteTalk animates the keyframe from the vocal stem for exactly this stretch (6.9 s): mouth, head and breathing follow the voice. It is spliced into the video in task 8.</p><p class="src">Noble Hunt · 7c-lip-sync</p></figure><figure class="ex" id="8a-the-video"><div class="task">Task 8 · Assemble the video</div><h2>The finished video, scene by scene</h2><div class="two"><div><img src="20261107-pipeline-examples/src/8a-0.jpg" width="352"><div class="lab">S1 · 0:27</div></div><div><img src="20261107-pipeline-examples/src/8a-1.jpg" width="352"><div class="lab">S2 · 1:13</div></div><div><img src="20261107-pipeline-examples/src/8a-2.jpg" width="352"><div class="lab">S3 · 1:46</div></div><div><img src="20261107-pipeline-examples/src/8a-3.jpg" width="352"><div class="lab">S4 · 2:24</div></div><div><img src="20261107-pipeline-examples/src/8a-4.jpg" width="352"><div class="lab">S5 · 3:00</div></div><div><img src="20261107-pipeline-examples/src/8a-5.jpg" width="352"><div class="lab">S6 · 3:38</div></div></div><p class="cap">One frame from the middle of each story scene of the finished 4-minute video: the arc from hiding indoors to standing in the open at dawn. Frames retimed to the beat (each bar played at 0.83–1.14× speed, median 1.01×), colour graded, deflared, song added.</p><p class="src">Noble Hunt · 8a-the-video</p></figure><figure class="ex" id="8b-splice"><div class="task">Task 8 · Assemble the video</div><h2>The singing clip, spliced in</h2><div class="two"><div><img src="20261107-pipeline-examples/src/8b-0.jpg" width="352"><div class="lab">before · 2:16.9</div></div><div><img src="20261107-pipeline-examples/src/8b-1.jpg" width="352"><div class="lab">singing clip · 2:20.4</div></div><div><img src="20261107-pipeline-examples/src/8b-2.jpg" width="352"><div class="lab">after · 2:25.8</div></div></div><p class="cap">The singing clip replaces the video from 2:17.9 to 2:24.8: its sung line plus a quarter-second either side. It goes in after the grade, so it is not graded.</p><p class="src">Noble Hunt · 8b-splice</p></figure></main></body></html>
