<svg xmlns="http://www.w3.org/2000/svg" width="728" height="598" viewBox="0 0 728 598" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="30" font-size="20" font-weight="700" fill="#1d2433">Is this transient an onset?</text><text x="16" y="56" font-size="12.5" font-weight="400" fill="#5b6475">Transient: the burst at a sound&#x27;s start. It spans several bars (shaded).</text><text x="16" y="76" font-size="13.5" font-weight="700" fill="#1d2433">1  Take each transient&#x27;s tallest bar (dark)</text><text x="16" y="96" font-size="13.5" font-weight="700" fill="#1d2433">2  Is it above the dashed line there?</text><text x="16" y="116" font-size="12" font-weight="400" fill="#5b6475">Dashed line: average of bars within 100 ms, + 0.07</text><text x="16" y="136" font-size="12" font-weight="400" fill="#5b6475">Shaded span: from where it starts rising to where it stops falling</text><rect x="16" y="154" width="14" height="12" fill="#2f9e6b"/><text x="36" y="164" font-size="12" fill="#5b6475">tallest bar: onset</text><rect x="252" y="154" width="14" height="12" fill="#a9dcc4"/><text x="272" y="164" font-size="12" fill="#5b6475">rest of that transient</text><rect x="488" y="154" width="14" height="12" fill="#c0392b"/><text x="508" y="164" font-size="12" fill="#5b6475">tallest bar: not an onset</text><rect x="16" y="174" width="14" height="12" fill="#eab3ab"/><text x="36" y="184" font-size="12" fill="#5b6475">rest of that bump</text><rect x="252" y="174" width="14" height="12" fill="#c9ced8"/><text x="272" y="184" font-size="12" fill="#5b6475">other sounds, outside the three</text><line x1="488" y1="180" x2="502" y2="180" stroke="#5b6475" stroke-width="2" stroke-dasharray="4 3"/><text x="508" y="184" font-size="12" fill="#5b6475">the line: average + 0.07</text><rect x="40" y="214" width="672" height="300" fill="#fafbfc" stroke="#d9dde5"/><rect x="93.8" y="216" width="215.0" height="296" rx="6" fill="#eaf6f0"/><rect x="308.8