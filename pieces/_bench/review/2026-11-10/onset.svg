<svg xmlns="http://www.w3.org/2000/svg" width="728" height="590" viewBox="0 0 728 590" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7d0a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="30" font-size="20" font-weight="700" fill="#1d2433">Which bars are onsets?</text><text x="16" y="52" font-size="12.5" fill="#5b6475">Bars: how much louder the sound just got, every 12 ms.</text><text x="16" y="78" font-size="13.5" font-weight="700" fill="#1d2433">A bar is an onset if it:</text><text x="16" y="98" font-size="13" fill="#1d2433">1  is above the dashed line</text><text x="16" y="117" font-size="13" fill="#1d2433">2  is as tall as the 2 bars before it</text><text x="16" y="136" font-size="13" fill="#1d2433">3  comes 30 ms after the last onset</text><text x="16" y="157" font-size="12" fill="#5b6475">Dashed line: average of the bars 100 ms either side, + 0.07 (see below)</text><rect x="16" y="178" width="14" height="12" fill="#2f9e6b"/><text x="36" y="188" font-size="12" fill="#5b6475">onset</text><rect x="188" y="178" width="14" height="12" fill="#c9ced8"/><text x="208" y="188" font-size="12" fill="#5b6475">fails 1: below line</text><rect x="360" y="178" width="14" height="12" fill="#e8a87c"/><text x="380" y="188" font-size="12" fill="#5b6475">fails 2: falling</text><rect x="532" y="178" width="14" height="12" fill="#f1a7a1"/><text x="552" y="188" font-size="12" fill="#5b6475">fails 3: too soon</text><rect x="40" y="214" width="672" height="280" fill="#fafbfc" stroke="#d9dde5"/><rect x="143.4" y="215" width="439.4" height="278" fill="#fdf6d8"/><rect x="41.0" y="460.5" width="23.8" height="33.5" fill="#c9ced8"/><rect x="66.8" y="474.2" width="23.8" height="19.8" fill="#c9ced8"/><rect x="92.7" y="486.1" width="23.8" height="7.9" fill="#c9ced8"/><rect x="118.5" y="485.9" width="23.8" height="8.1" fill=